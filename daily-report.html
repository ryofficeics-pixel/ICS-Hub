,43,.25);color:var(--danger)}.btn.small{min-height:31px;padding:6px 10px;font-size:13px}.btn:disabled{opacity:.45;cursor:not-allowed}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}.input,.select,.textarea{width:100%;border:1px solid var(--border);border-radius:14px;background:var(--surface2);padding:12px;color:var(--dark);outline:none}.textarea{min-height:100px;resize:vertical;line-height:1.45}.textarea.tall{min-height:150px}.input:focus,.select:focus,.textarea:focus{border-color:#111;box-shadow:0 0 0 3px rgba(26,26,26,.08)}.list{display:grid;gap:12px}.row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px;border:1px solid var(--border);border-radius:16px;background:var(--surface)}.row h3{margin:0}.row p{margin:4px 0 0;color:var(--muted);font-size:13px}.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--border);border-radius:999px;background:var(--surface2);font-size:12px;font-weight:700}.chip.ok{color:var(--ok)}.chip.bad{color:var(--danger)}.empty{text-align:center;padding:34px 18px;color:var(--muted)}.empty h3{margin:0 0 6px;color:var(--dark)}.snapshot{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.snap{border:1px solid var(--border);border-radius:14px;background:var(--surface2);padding:10px}.snap small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;font-weight:800}.snap strong{display:block;margin-top:4px}.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:10px}.photo-card{border:1px solid var(--border);border-radius:16px;background:var(--surface);overflow:hidden}.photo-card img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;background:#111}.photo-card .body{padding:10px;display:grid;gap:8px}.inline-file,. xt-overflow:ellipsis}.pdf-footer{position:absolute;left:46px;right:46px;bottom:22px;border-top:1px solid #dedbd1;padding-top:7px;display:flex;justify-content:space-between;gap:10px;color:#8f8b80;font-size:9pt;font-family:"IBM Plex Mono",monospace}.print-tip{margin-bottom:14px;padding:12px;border-radius:14px;background:#fff;border:1px solid var(--border)}.dphoto-page{padding:15mm!important;display:flex;flex-direction:column}.dphoto-header{display:flex;align-items:center;gap:12px;padding-bottom:8px;border-bottom:2px solid #1a1a1a}.dphoto-logo{width:38px;height:38px;border-radius:8px;overflow:hidden;flex:0 0 auto;background:#111}.dphoto-logo img{width:100%;height:100%;object-fit:contain}.dphoto-title{flex:1;min-width:0}.dphoto-title h1{margin:0;font-size:15pt;font-weight:800;letter-spacing:.2px;font-family:"DM Sans",Arial,sans-serif}.dphoto-title p{margin:2px 0 0;font-size:9pt;color:#555}.dphoto-meta{text-align:right;font-size:8.5pt;color:#555;line-height:1.5;white-space:nowrap}.dphoto-meta b{color:#111}.dphoto-table{display:flex;flex-direction:column;gap:5mm;margin-top:6mm}.dphoto-row{display:grid;grid-template-columns:46% 54%;gap:6mm;height:70mm;flex:0 0 70mm}.dphoto-row.is-empty{visibility:hidden}.dphoto-col-foto{border:1px solid #d8d5cc;border-radius:6px;overflow:hidden;background:#f4f3ee}.dphoto-col-foto img{display:block;width:100%;height:100%;object-fit:cover}.dphoto-col-ket{border:1px solid #e4e2d9;border-radius:6px;padding:5mm 6mm;display:flex;flex-direction:column;justify-content:center;gap:2.4mm;background:#fdfcfa;font-size:8.6pt;line-height:1.35;overflow:hidden}.dphoto-col-ket .dphoto-no{font-size:9.5pt;font-weight:800;color:#111;margin-bottom:1mm;text-transform:uppercase;letter-spacing:.3px}.dphoto-field{display:flex;gap:4px}.dphoto-field .lbl{font-weight:700;color:#3a3a3a;min-width:24mm;flex:0 0 auto}.dphoto-field .val{color:#444;white-space:pre-wrap;word-break:break-word}.dphoto-footer{margin-top:6mm;padding-top:5px;border-top:1px solid #ddd;display:flex function migrateDuplicateWeeklyProjects(){db.projects=(db.projects||[]).map(normalizeProjectRecord);const canonicalByKey=new Map(),idMap=new Map(),merged=[];for(const project of db.projects){const key=normalizeProjectKey(project);const canonical=canonicalByKey.get(key);if(canonical){idMap.set(project.id,canonical.id);canonical.sourceSurveyIds=[...new Set([...(canonical.sourceSurveyIds||[]),...(project.sourceSurveyIds||[])])];if(!canonical.location&&project.location)canonical.location=project.location;if(!canonical.owner&&project.owner)canonical.owner=project.owner;canonical.updatedAt=new Date().toISOString()}else{canonicalByKey.set(key,project);merged.push(project)}}if(idMap.size){db.dailyReports.forEach(r=>{if(idMap.has(r.projectId))r.projectId=idMap.get(r.projectId)});db.weeklyReports.forEach(w=>{if(idMap.has(w.projectId))w.projectId=idMap.get(w.projectId)});db.surveys.forEach(s=>{if(idMap.has(s.linkedProjectId))s.linkedProjectId=idMap.get(s.linkedProjectId)})}db.projects=merged}

function viewProjects(){const p=getProjectById(activeProjectId)||{};return `<section><div class="toolbar"><div class="title"><h1>Data Proyek</h1><p>Satu data proyek dipakai bersama oleh Survey, Daily Progress, dan Weekly Progress.</p></div><button class="btn" data-go="daily">Kembali</button></div><div class="grid"><div class="card pad span5"><form class="form" id="projectForm"><input type="hidden" name="id" value="${esc(p.id||"")}"><div class="field full"><label>Nama proyek</label><input class="input" name="name" required value="${esc(p.name||"")}"></div><div class="field full"><label>Lokasi</label><input class="input" name="location" value="${esc(p.location||"")}"></div><div class="field"><label>Owner</label><input class="input" name="owner" value="${esc(p.owner||"")}"></div><div class="field"><label>Estimator</label><input class="input" name="estimator" value="${esc(p.estimator||p.pic||"")}"></div><div class="field full"><label>Tim</label><input class="input" name="team" value="${esc(p.team||"Tim ICS")}"></div><div class="field full"><button class="btn primary" type="submit">Simpan Proyek</button></div></form>${p.id?`<div class="danger-zone"><button class="btn warn" onclick="deleteProject('${p.id}')">Hapus Data Proyek</button><p class="muted">Menghapus proyek juga menghapus laporan Survey, Daily Progress, dan Weekly Progress yang terkait.</p></div>`:""}</div><div class="card pad span7"><h2 style="margin-top:0">Proyek Tersimpan</h2><div class="list">${db.projects.map(p=>`<article class="row"><div><h3>${esc(p.name)}</h3><p>${esc(p.location||"-")} - ${esc(p.owner||"-")}</p><div class="meta"><span class="chip">${getDailyReportsByProjectAndPeriod(p.id).length} Daily Progress</span><span class="chip">${weeklyReportsForProject(p.id).length} Weekly Progress</span></div></div><div class="actions"><button class="btn small primary" onclick="activeProjectId='${p.id}';route='daily';render()">Daily</button><button class="btn small" onclick="activeProjectId='${p.id}';route='weekly';render()">Weekly</button><button class="btn small" onclick="activeProjectId='${p.id}';route='projects';render()">Edit</button><button class="btn small warn" onclick="deleteProject('${p.id}')">Hapus</button></div></article>`).join("")||`<div class="empty"><h3>Belum ada proyek</h3><p>Tambahkan proyek eksplisit sebelum membuat Daily atau Weekly.</p></div>`}</div></div></div></section>`}
function saveProject(fd){const explicitId=fd.get("id");const data={id:explicitId||uid("project"),name:String(fd.get("name")||"").trim(),location:fd.get("location")||"",owner:fd.get("owner")||"",estimator:fd.get("estimator")||"",team:fd.get("team")||"Tim ICS",updatedAt:new Date().toISOString()};if(!data.name){alert("Nama proyek wajib diisi.");return null}const existing=explicitId?getProjectById(explicitId):findExistingProject(data);if(existing){Object.assign(existing,{...data,id:existing.id,createdAt:existing.createdAt||new Date().toISOString()});activeProjectId=existing.id}else{db.projects.push({...data,createdAt:new Date().toISOString()});activeProjectId=data.id}save();route="projects";render();return activeProjectId}
function deleteProject(projectId){const p=getProjectById(projectId);if(!p)return;if(!confirm(`Delete data proyek "${p.name}" beserta Daily/Weekly terkait?`))return;db.projects=db.projects.filter(x=>x.id!==projectId);db.dailyReports=db.dailyReports.filter(x=>x.projectId!==projectId);db.weeklyReports=db.weeklyReports.filter(x=>x.projectId!==projectId);db.surveys.forEach(s=>{if(s.linkedProjectId===projectId){s.status="survey_only";s.linkedProjectId=null;s.linkedDailyReportId=null}});if(activeProjectId===projectId)activeProjectId=db.projects[0]?.id||"";save();route="projects";render()}
function viewSurvey(){const s=activeSurveyId?getSurveyById(activeSurveyId):null;return `<section><div class="toolbar"><div class="title"><h1>Survey Proyek</h1><p>Survey yang memiliki nama proyek akan tersambung ke database proyek tanpa membuat duplikat.</p></div><button class="btn primary" onclick="activeSurveyId='';render()">Survey Baru</button></div><div class="grid"><div class="card pad span5"><form class="form" id="surveyForm"><input type="hidden" name="id" value="${esc(s?.id||"")}"><div class="field"><label>Tanggal survey</label><input class="input" type="date" name="surveyDate" required value="${esc(s?.surveyDate||today())}"></div><div class="field"><label>Status</label><input class="input" value="${esc(statusLabel(s?.status||"survey_only"))}" disabled></div><div class="field full"><label>Nama proyek / lokasi survey</label><input class="input" name="title" value="${esc(s?.title||"")}"></div><div class="field full"><label>Hasil survey</label><textarea class="textarea tall" name="surveyData">${esc(s?.surveyData||"")}</textarea></div><div class="field full"><label>Kendala / catatan</label><textarea class="textarea" name="kendala">${esc(s?.kendala||"")}</textarea></div><div class="field full"><label>Follow-up</label><textarea class="textarea" name="followUp">${esc(s?.followUp||"")}</textarea></div><div class="field full"><label>Foto survey</label><input class="input" type="file" name="photos" accept="image/*" multiple></div><div class="field full"><button class="btn primary" type="submit">Simpan Survey</button></div></form>${s?convertSurveyBox(s):""}</div><div class="card pad span7"><h2 style="margin-top:0">Daftar Survey</h2><div class="list">${db.surveys.map(s=>`<article class="row"><div><h3>${esc(s.title||"Survey")} <span class="chip ${s.status==="converted_to_daily"||s.status==="added_to_daily_progress"?"ok":""}">${esc(statusLabel(s.status))}</span></h3><p>${fmtDate(s.surveyDate)} - ${esc(trim(s.surveyData||"-"))}</p><div class="meta">${s.linkedProjectId?`<span class="chip">${esc(getProjectById(s.linkedProjectId)?.name||"Proyek terdaftar di database")}</span>`:""}${s.linkedDailyReportId?`<span class="chip">Aktif untuk Daily Progress</span>`:""}</div></div><div class="actions"><button class="btn small primary" onclick="activeSurveyId='${s.id}';render()">Buka</button></div></article>`).join("")||`<div class="empty"><h3>Belum ada survey</h3><p>Isi survey sebagai data Survey saja.</p></div>`}</div></div></div></section>`}
function convertSurveyBox(s){return `<div class="card pad" style="margin-top:14px"><h2 style="margin-top:0">Masukkan ke Daily Progress</h2><p class="muted">Pilih proyek yang sudah terdaftar. Aksi ini mengaktifkan workflow Daily Progress tanpa membuat duplikat proyek.</p><form class="form" id="convertSurveyForm"><input type="hidden" name="surveyId" value="${esc(s.id)}"><div class="field full"><label>Pilih proyek terdaftar</label>${projectSelectorHTML(s.linkedProjectId||activeProjectId,true)}</div><div class="field full"><button class="btn primary" type="submit" ${db.projects.length?"":"disabled"}>Masukkan ke Daily Progress</button></div></form><div class="actions" style="margin-top:10px"><button class="btn" onclick="createProjectFromSurvey('${s.id}')">Daftarkan sebagai Proyek Baru</button></div></div>`}
async function saveSurvey(fd){const id=fd.get("id")||uid("survey");let s=getSurveyById(id);const existingPhotos=s?.photos||[];const newPhotos=[];for(const file of fd.getAll("photos")){if(file&&file.size&&file.type.startsWith("image/"))newPhotos.push({id:uid("photo"),url:await imageToData(file),caption:file.name,takenAt:new Date().toISOString()})}const data={id,surveyDate:fd.get("surveyDate")||today(),title:fd.get("title")||"",surveyData:fd.get("surveyData")||"",kendala:fd.get("kendala")||"",followUp:fd.get("followUp")||"",photos:[...existingPhotos,...newPhotos],status:s?.status||"survey_only",linkedProjectId:s?.linkedProjectId||null,linkedDailyReportId:s?.linkedDailyReportId||null,updatedAt:new Date().toISOString()};if(data.title){const p=ensureProjectFromSurvey(data);data.linkedProjectId=p.id;if(!data.linkedDailyReportId)data.status="project_registered"}if(s)Object.assign(s,data);else db.surveys.push({...data,createdAt:new Date().toISOString()});activeSurveyId=id;activeProjectId=data.linkedProjectId||activeProjectId;save();render()}
function createProjectFromSurvey(surveyId){const s=getSurveyById(surveyId);if(!s)return alert("Survey tidak ditemukan.");const p=ensureProjectFromSurvey(s);linkSurveyToProject(s.id,p.id);activeProjectId=p.id;save();render()}
function convertSurveyToDailyReport(surveyId,projectId){const s=getSurveyById(surveyId),p=getProjectById(projectId);if(!s)return alert("Survey tidak ditemukan.");if(!p)return alert("Pilih proyek terdaftar dulu.");const existing=s.linkedDailyReportId?getDailyById(s.linkedDailyReportId):null;const id=existing?.id||uid("daily");const daily={id,projectId:p.id,date:s.surveyDate||today(),sourceSurveyId:s.id,progress:s.surveyData||"",notes:s.title||"",kendala:s.kendala||"",followUp:s.followUp||"",documentationMeta:{weather:"Survey",workHours:"Survey",area:s.title||""},photos:(s.photos||[]).map((ph,i)=>({id:ph.id||uid("photo"),number:i+1,url:ph.url,caption:ph.caption||s.title||"",takenAt:ph.takenAt||new Date().toISOString(),includeWeekly:true})),createdAt:existing?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()};if(existing)Object.assign(existing,daily);else db.dailyReports.push(daily);Object.assign(s,{status:"added_to_daily_progress",linkedProjectId:p.id,linkedDailyReportId:id,updatedAt:new Date().toISOString()});activateProjectForDailyProgress(p.id,s.id);activeProjectId=p.id;editingDailyId=id;activeDate=daily.date;route="daily";save();render()}
function viewDaily(){const p=getProjectById(activeProjectId),r=editingDailyId?getDailyById(editingDailyId):db.dailyReports.find(x=>x.projectId===activeProjectId&&x.date===activeDate);return `<section><div class="toolbar"><div class="title"><h1>Daily Report</h1><p>Daily Report wajib memilih proyek yang sudah terdaftar.</p></div><div class="actions"><button class="btn primary" onclick="previewActiveDaily()" ${p?"":"disabled"}>Generate Daily PDF</button><button class="btn" data-go="weekly">Generate Weekly</button></div></div><div class="grid"><div class="card pad span5"><div class="field"><label>Pilih proyek</label>${projectSelectorHTML(activeProjectId,true)}</div>${p?projectSummary(p):`<div class="empty"><h3>Belum ada proyek</h3><p>Buat atau daftarkan proyek dulu. Daily tidak bisa dibuat tanpa proyek.</p><button class="btn primary" data-go="projects">Tambah Proyek</button></div>`}<div class="field" style="margin-top:12px"><label>Tanggal aktif</label><input class="input" type="date" value="${activeDate}" onchange="activeDate=this.value||today();editingDailyId='';render()"></div></div><div class="card pad span7">${p?dailyForm(r||blankDaily()):""}</div><div class="card pad span12">${p?dailyList(p.id):""}</div></div></section>`}
function blankDaily(){return{id:"",projectId:activeProjectId,date:activeDate,sourceSurveyId:null,progress:"",notes:"",kendala:"",followUp:"",documentationMeta:{weather:"Cerah",workHours:"08:00 - 17:00",area:""},photos:[]}}
function dailyForm(r){return `<form class="form" id="dailyForm"><input type="hidden" name="id" value="${esc(r.id)}"><input type="hidden" name="sourceSurveyId" value="${esc(r.sourceSurveyId||"")}"><div class="field"><label>Tanggal report</label><input class="input" type="date" name="date" required value="${esc(r.date||activeDate)}"></div><div class="field"><label>Referensi survey</label><input class="input" value="${esc(surveyDisplayName(r.sourceSurveyId))}" disabled></div><div class="field"><label>Cuaca</label><input class="input" name="weather" value="${esc(r.documentationMeta?.weather||"")}"></div><div class="field"><label>Jam kerja</label><input class="input" name="workHours" value="${esc(r.documentationMeta?.workHours||"")}"></div><div class="field full"><label>Area dokumentasi</label><input class="input" name="area" value="${esc(r.documentationMeta?.area||"")}"></div><div class="field full"><label>Progress pekerjaan hari ini</label><textarea class="textarea tall" name="progress" required>${esc(r.progress||"")}</textarea></div><div class="field full"><label>Notes</label><textarea class="textarea" name="notes">${esc(r.notes||"")}</textarea></div><div class="field full"><label>Kendala</label><textarea class="textarea" name="kendala">${esc(r.kendala||"")}</textarea></div><div class="field full"><label>Pesan / tindak lanjut</label><textarea class="textarea" name="followUp">${esc(r.followUp||"")}</textarea></div><div class="field full"><label>Tambah foto</label><input class="input" type="file" name="photos" accept="image/*" multiple></div><div class="field full">${photoEditor(r)}</div><div class="field full"><button class="btn primary" type="submit" ${activeProjectId?"":"disabled"}>Simpan Daily Report</button></div></form>`}
function photoEditor(r){const photos=photosOf(r);return `<div class="photo-grid">${photos.map(ph=>`<article class="photo-card"><img src="${ph.url}" alt=""><div class="body"><textarea class="textarea" data-photo-caption="${ph.id}" placeholder="Caption">${esc(ph.caption||"")}</textarea><label class="chip"><input type="checkbox" data-photo-weekly="${ph.id}" ${ph.includeWeekly!==false?"checked":""}> Include weekly</label><button class="btn small warn" type="button" onclick="removePhoto('${ph.id}')">Hapus</button></div></article>`).join("")||`<p class="muted">Belum ada foto.</p>`}</div>`}
function dailyList(projectId){const items=getDailyReportsByProjectAndPeriod(projectId),p=getProjectById(projectId);return `<h2 style="margin-top:0">Daily Report Proyek</h2><div class="list">${items.map(r=>`<article class="row"><div><h3>${fmtDate(r.date)} ${r.sourceSurveyId?'<span class="chip">Dari Survey</span>':""}</h3><p>${esc(trim(r.progress||"-"))}</p><div class="meta"><span class="chip">${photosOf(r).length} foto</span><span class="chip">${esc(p?.name||"Proyek")}</span></div></div><div class="actions"><button class="btn small primary" onclick="openDailyReport('${r.id}')">Preview</button><button class="btn small" onclick="editDailyReport('${r.id}')">Edit</button><button class="btn small warn" onclick="deleteDailyReport('${r.id}')">Hapus</button></div></article>`).join("")||`<div class="empty"><h3>Belum ada Daily Report</h3><p>Isi form untuk proyek ini.</p></div>`}</div>`}
async function saveDailyReport(fd){const projectId=activeProjectId;if(!getProjectById(projectId)){alert("Daily Report wajib memilih existing project.");return}const id=fd.get("id")||editingDailyId||uid("daily");let r=getDailyById(id);const currentPhotos=photosOf(r);capturePhotoCaptions(currentPhotos);const newPhotos=[];for(const file of fd.getAll("photos")){if(file&&file.size&&file.type.startsWith("image/"))newPhotos.push({id:uid("photo"),number:currentPhotos.length+newPhotos.length+1,url:await imageToData(file),caption:file.name,takenAt:new Date().toISOString(),includeWeekly:true})}const data={id,projectId,date:fd.get("date")||activeDate,sourceSurveyId:fd.get("sourceSurveyId")||r?.sourceSurveyId||null,progress:fd.get("progress")||"",notes:fd.get("notes")||"",kendala:fd.get("kendala")||"",followUp:fd.get("followUp")||"",documentationMeta:{weather:fd.get("weather")||"",workHours:fd.get("workHours")||"",area:fd.get("area")||""},photos:[...currentPhotos,...newPhotos].map((p,i)=>({...p,number:i+1})),createdAt:r?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()};if(!data.progress&&!confirm("Progress detail kosong. Tetap simpan?"))return;if(r)Object.assign(r,data);else db.dailyReports.push(data);editingDailyId=id;activeDate=data.date;save();render()}
function capturePhotoCaptions(list){$$("[data-photo-caption]").forEach(el=>{const ph=list.find(p=>p.id===el.dataset.photoCaption);if(ph)ph.caption=el.value});$$("[data-photo-weekly]").forEach(el=>{const ph=list.find(p=>p.id===el.dataset.photoWeekly);if(ph)ph.includeWeekly=el.checked})}
function editDailyReport(id){const r=getDailyById(id);if(!r)return;activeProjectId=r.projectId;editingDailyId=id;activeDate=r.date;route="daily";render()}
function openDailyReport(id){const r=getDailyById(id);if(!r)return;activeProjectId=r.projectId;previewDailyId=id;route="dailyPreview";render()}
function deleteDailyReport(id){if(!confirm("Hapus Daily Report ini?"))return;db.dailyReports=db.dailyReports.filter(r=>r.id!==id);db.weeklyReports.forEach(w=>{w.sourceDailyReportIds=(w.sourceDailyReportIds||[]).filter(x=>x!==id)});save();render()}
function removePhoto(id){const r=editingDailyId?getDailyById(editingDailyId):db.dailyReports.find(x=>x.projectId===activeProjectId&&x.date===activeDate);if(!r)return;r.photos=photosOf(r).filter(p=>p.id!==id).map((p,i)=>({...p,number:i+1}));save();render()}
function previewActiveDaily(){const r=editingDailyId?getDailyById(editingDailyId):db.dailyReports.find(x=>x.projectId===activeProjectId&&x.date===activeDate);if(!r)return alert("Simpan Daily Report dulu.");openDailyReport(r.id)}
function viewDailyPreview(){const r=getDailyById(previewDailyId);if(!r)return `<div class="empty"><h3>Daily tidak ditemukan</h3></div>`;const p=getProjectById(r.projectId);return `<section><div class="toolbar no-print"><div class="title"><h1>Daily Report Preview</h1><p>PDF memakai data proyek terdaftar yang sama dengan Daily Report.</p></div><div class="actions"><button class="btn" data-go="daily">Kembali</button><button class="btn primary" onclick="exportDailyPDF('${r.id}')">Export / Simpan PDF</button></div></div><div class="report-pages">${dailyPdfPages(r,p)}</div></section>`}
function reportCoverPage(kind,title,p,boxes,date){return `<section class="paper cover"><div><img class="cover-logo" src="${DEFAULT_LOGO_URL}" alt="ICS Logo"><div class="kicker">${esc(kind)}</div><h1 class="cover-title">${esc(title)}</h1><h2>${esc(p?.name||"-")}</h2></div><div class="cover-grid">${boxes.map(b=>`<div class="cover-box"><small>${esc(b.label)}</small><strong>${esc(b.value||"-")}</strong></div>`).join("")}</div>${footerHtml(p?.name,date)}</section>`}
function dailyPdfPages(r,p){const photos=photosOf(r),groups=[];for(let i=0;i<Math.max(photos.length,1);i+=3){const g=photos.slice(i,i+3);while(g.length<3)g.push(null);groups.push(g)}const cover=reportCoverPage("Daily Report","Daily Report",p,[{label:"Tanggal",value:fmtDate(r.date)},{label:"Lokasi",value:p?.location||"-"},{label:"Owner",value:p?.owner||"-"},{label:"Estimator",value:p?.estimator||"-"},{label:"Dibuat oleh",value:p?.team||"Tim ICS"},{label:"Foto",value:String(photos.length)}],r.date);return `${cover}<section class="paper"><h2>Detail Daily Report</h2>${section("Progress Detail",r.progress)}${section("Notes",r.notes)}${section("Kendala",r.kendala)}${section("Follow-up",r.followUp)}${section("Documentation Metadata",`Weather: ${r.documentationMeta?.weather||"-"}\nWork hours: ${r.documentationMeta?.workHours||"-"}\nArea: ${r.documentationMeta?.area||"-"}`)}${footerHtml(p?.name,r.date)}</section>${groups.map((g,i)=>dailyPhotoPage(g,r,p,i+1,groups.length)).join("")}`}
function dailyPhotoPage(g,r,p,pageNum,totalPages){return `<section class="paper dphoto-page">${dailyPhotoHeader(r,p,pageNum,totalPages)}<div class="dphoto-table">${g.map(ph=>dailyPhotoRow(ph,r.date,r.documentationMeta?.area)).join("")}</div>${dailyPhotoFooter(p,pageNum)}</section>`}
function dailyPhotoHeader(r,p,pageNum,totalPages){return `<div class="dphoto-header"><div class="dphoto-logo"><img src="${DEFAULT_LOGO_URL}" alt="Logo"></div><div class="dphoto-title"><h1>Laporan Foto Harian</h1><p>${esc(p?.name||"-")}${p?.location?` &mdash; ${esc(p.location)}`:""}</p></div><div class="dphoto-meta"><div>Tanggal: <b>${fmtDate(r.date)}</b></div><div>Halaman <b>${pageNum}</b> / ${totalPages}</div></div></div>`}
function dailyPhotoFooter(p,pageNum){return `<div class="dphoto-footer"><span>IC Solution</span><span>Dicetak: ${fmtDateTime(new Date().toISOString())}</span><span>Halaman ${pageNum}</span></div>`}
function dailyPhotoRow(ph,date,area){if(!ph)return `<div class="dphoto-row is-empty"><div class="dphoto-col-foto"></div><div class="dphoto-col-ket"></div></div>`;return `<div class="dphoto-row"><div class="dphoto-col-foto"><img src="${ph.url}" alt="Foto ${ph.number||""}"></div><div class="dphoto-col-ket"><div class="dphoto-no">Foto No. ${String(ph.number||1).padStart(2,"0")}</div><div class="dphoto-field"><span class="lbl">Tanggal:</span><span class="val">${fmtDate(date)}</span></div><div class="dphoto-field"><span class="lbl">Area:</span><span class="val">${esc(area||"-")}</span></div><div class="dphoto-field"><span class="lbl">Caption:</span><span class="val">${esc(ph.caption||"-")}</span></div></div></div>`}
function viewWeekly(){const p=getProjectById(activeProjectId),start=$("#periodStart")?.value||startOfWeek(activeDate),end=$("#periodEnd")?.value||activeDate,dailies=p?getDailyReportsByProjectAndPeriod(p.id,start,end):[];return `<section><div class="toolbar"><div class="title"><h1>Weekly Report</h1><p>Weekly adalah agregasi Daily Report berdasarkan proyek terdaftar dan periode custom.</p></div><button class="btn" data-go="daily">Kembali</button></div><div class="grid"><div class="card pad span5"><form class="form" id="weeklyForm"><div class="field full"><label>Pilih proyek</label>${projectSelectorHTML(activeProjectId,true)}</div><div class="field"><label>Periode mulai</label><input class="input" type="date" id="periodStart" name="periodStart" value="${start}" onchange="render()"></div><div class="field"><label>Periode selesai</label><input class="input" type="date" id="periodEnd" name="periodEnd" value="${end}" onchange="render()"></div><div class="field full"><label>Upload Time Schedule PDF optional</label><input class="input" type="file" name="progressPdf" accept="application/pdf,.pdf"><p class="muted">PDF progress akan dirender menjadi halaman gambar agar aman saat export PDF.</p></div><div class="field full"><button class="btn primary" type="submit" ${p&&dailies.length?"":"disabled"}>Generate Weekly Progress</button></div></form>${p?projectSummary(p):`<div class="empty"><h3>Pilih proyek</h3></div>`}</div><div class="card pad span7"><h2 style="margin-top:0">Daily Report dalam periode</h2>${dailies.length?weeklySummaryPreview(dailies):`<div class="empty"><h3>Tidak ada laporan harian pada periode ini</h3><p>Weekly tidak akan dibuat dan data proyek tidak akan berubah.</p></div>`}<div class="list">${dailies.map(r=>`<article class="row"><div><h3>${fmtDate(r.date)}</h3><p>${esc(trim(r.progress||"-"))}</p><div class="meta"><span class="chip">${photosOf(r).length} foto</span></div></div><button class="btn small" onclick="openDailyReport('${r.id}')">Open Daily</button></article>`).join("")}</div></div><div class="card pad span12">${renderWeeklyReportsForProject(activeProjectId)}</div></div></section>`}
function weeklySummaryPreview(dailies){const s=generateWeeklySummaryFromDailyReports(dailies);return `<div class="pdf-section" style="margin-top:0"><h3>Preview Ringkasan</h3><p>${esc(s.autoSummary)}</p></div><div class="snapshot" style="margin:12px 0"><div class="snap"><small>Daily Progress</small><strong>${dailies.length}</strong></div><div class="snap"><small>Foto</small><strong>${s.photos.length}</strong></div><div class="snap"><small>Kendala</small><strong>${s.kendalaItems.length}</strong></div><div class="snap"><small>Follow-up</small><strong>${s.followUpItems.length}</strong></div></div>`}
function generateWeeklySummaryFromDailyReports(dailyReports){const map=(key)=>dailyReports.map(r=>({id:r.id,date:r.date,text:String(r[key]||"").trim()})).filter(x=>x.text);const progressItems=map("progress"),kendalaItems=map("kendala"),followUpItems=map("followUp"),notesItems=map("notes");const photos=dailyReports.flatMap(r=>photosOf(r).filter(p=>p.includeWeekly!==false).map(p=>({...p,sourceDailyReportId:r.id,sourceDate:r.date,sourceArea:r.documentationMeta?.area||""})));const autoSummary=[`Periode ini memiliki ${dailyReports.length} Daily Report (${fmtDate(dailyReports[0]?.date)} - ${fmtDate(dailyReports.at(-1)?.date)}).`,progressItems.length?`Progress utama: ${progressItems.map(x=>x.text).join("; ")}.`:"Progress utama belum diisi.",kendalaItems.length?`Kendala: ${kendalaItems.map(x=>x.text).join("; ")}.`:"Tidak ada kendala tercatat.",followUpItems.length?`Follow-up: ${followUpItems.map(x=>x.text).join("; ")}.`:"Tidak ada follow-up tercatat.",`Foto terpilih: ${photos.length}.`].join("\n");return{autoSummary,progressItems,kendalaItems,followUpItems,notesItems,photos,dailySnapshots:JSON.parse(JSON.stringify(dailyReports))}}
async function saveWeeklyReport(projectId,periodStart,periodEnd,summaryData,progressFile=null){if(!getProjectById(projectId)){alert("Proyek tidak valid. Weekly tidak dibuat.");return null}if(!periodStart||!periodEnd||periodStart>periodEnd){alert("Periode tidak valid.");return null}const beforeProjectCount=db.projects.length;const dailies=getDailyReportsByProjectAndPeriod(projectId,periodStart,periodEnd);if(!dailies.length){alert("Tidak ada laporan harian pada periode ini.");return null}const duplicate=db.weeklyReports.find(w=>w.projectId===projectId&&w.periodStart===periodStart&&w.periodEnd===periodEnd);if(duplicate&&!confirm("Weekly Report untuk proyek dan periode ini sudah ada. Update laporan yang ada?"))return null;let progressAttachment=duplicate?.progressAttachment||null;if(progressFile&&progressFile.size){if(!String(progressFile.type||"").includes("pdf")&&!/\\.pdf$/i.test(progressFile.name)){alert("Lampiran progress harus PDF.");return null}progressAttachment={name:progressFile.name,type:progressFile.type||"application/pdf",url:await fileToData(progressFile),renderedPages:[],renderStatus:"pending",renderError:""}}const payload={id:duplicate?.id||uid("weekly"),projectId,periodStart,periodEnd,weekLabel:`${fmtDate(periodStart)} - ${fmtDate(periodEnd)}`,sourceDailyReportIds:dailies.map(r=>r.id),autoSummary:summaryData.autoSummary,summaryData,manualNotes:duplicate?.manualNotes||"",progressAttachment,status:duplicate?.status||"draft",generatedAt:duplicate?.generatedAt||new Date().toISOString(),updatedAt:new Date().toISOString()};if(duplicate)Object.assign(duplicate,payload);else db.weeklyReports.push(payload);if(db.projects.length!==beforeProjectCount){db.projects=db.projects.slice(0,beforeProjectCount);alert("Weekly tidak membuat proyek baru. Data proyek baru yang tidak valid dibatalkan.")}previewWeeklyId=payload.id;save();route="weeklyPreview";render();return payload.id}
function renderWeeklyReportsForProject(projectId){const p=getProjectById(projectId),items=p?weeklyReportsForProject(projectId):[];return `<h2 style="margin-top:0">Weekly Reports ${p?`- ${esc(p.name)}`:""}</h2><div class="list">${items.map(w=>{const s=w.summaryData||{};return `<article class="row"><div><h3>${esc(w.weekLabel)}</h3><p>${fmtDate(w.periodStart)} - ${fmtDate(w.periodEnd)}<br>${(w.sourceDailyReportIds||[]).length} Daily Progress, ${(s.photos||[]).length} foto</p><div class="meta"><span class="chip">${esc(statusLabel(w.status||"draft"))}</span></div></div><div class="actions"><button class="btn small primary" onclick="previewWeeklyId='${w.id}';route='weeklyPreview';render()">Buka</button><button class="btn small warn" onclick="deleteWeekly('${w.id}')">Hapus</button></div></article>`}).join("")||`<div class="empty"><h3>Belum ada Weekly Report</h3><p>Generate dari Daily Report periode custom.</p></div>`}</div>`}
function viewWeeklyPreview(){const w=getWeeklyById(previewWeeklyId);if(!w)return `<div class="empty"><h3>Weekly Report tidak ditemukan</h3></div>`;setTimeout(()=>ensureWeeklyPdfRendered(w.id),0);return `<section><div class="toolbar no-print"><div class="title"><h1>Weekly Report Preview</h1><p>Weekly tersimpan sebagai laporan mingguan untuk proyek terdaftar.</p></div><div class="actions"><button class="btn" data-go="weekly">Kembali</button><button class="btn primary" onclick="generateWeeklyPdf('${w.id}')">Export / Simpan PDF</button></div></div><div class="report-pages">${weeklyPdfPages(w)}</div></section>`}
function weeklyPdfPages(w){const p=getProjectById(w.projectId),s=w.summaryData||generateWeeklySummaryFromDailyReports((w.sourceDailyReportIds||[]).map(getDailyById).filter(Boolean)),photos=s.photos||[],groups=[];for(let i=0;i<Math.max(photos.length,1);i+=3){const g=photos.slice(i,i+3);while(g.length<3)g.push(null);groups.push(g)}const cover=reportCoverPage("Laporan Mingguan","Laporan Mingguan Progress Proyek",p,[{label:"Minggu",value:w.weekLabel},{label:"Periode",value:`${fmtDate(w.periodStart)} - ${fmtDate(w.periodEnd)}`},{label:"Lokasi",value:p?.location||"-"},{label:"Owner/client",value:p?.owner||"-"},{label:"Estimator",value:p?.estimator||"-"},{label:"Dibuat oleh",value:p?.team||"Tim ICS"},{label:"Tanggal dibuat",value:fmtDate((w.generatedAt||"").slice(0,10)||today())}],w.periodEnd);return `${cover}${weeklySummaryPages(w,s,p)}${attachmentReportPages(w)}${dailyTablePage(w,s)}${groups.map((g,i)=>`<section class="paper"><div class="kicker">Dokumentasi Foto</div><h2>Foto Weekly - Halaman ${i+1}</h2>${g.map(ph=>photoBlock(ph,ph?.sourceDate,ph?.sourceArea)).join("")}${footerHtml(p?.name,w.periodEnd)}</section>`).join("")}`}
function splitText(v,max=760){const s=String(v||"-").trim()||"-";if(s.length<=max)return[s];const parts=[];let rest=s;while(rest.length>max){let cut=rest.lastIndexOf("\n",max);if(cut<max*.45)cut=rest.lastIndexOf(". ",max);if(cut<max*.45)cut=rest.lastIndexOf(" ",max);if(cut<max*.45)cut=max;parts.push(rest.slice(0,cut).trim());rest=rest.slice(cut).trim()}if(rest)parts.push(rest);return parts}
function weeklySummaryPages(w,s,p){const cards=[{title:"Progress Mingguan",html:`${summaryList("Progress Summary",s.progressItems)}${summaryList("Notes",s.notesItems)}`},{title:"Summary Mingguan",text:w.autoSummary||s.autoSummary},{title:"Notes / Logs / Kendala",html:summaryList("Kendala Summary",s.kendalaItems)},{title:"Follow-up / Tindak Lanjut",html:summaryList("Follow-up Summary",s.followUpItems)}].flatMap(card=>card.html?[card]:splitText(card.text,760).map((text,i)=>({title:i?`${card.title} - Lanjutan`:card.title,text})));const pages=[];while(cards.length){const chunk=cards.splice(0,2);pages.push(`<section class="paper"><h2>${pages.length?"Ringkasan Mingguan - Lanjutan":"Ringkasan Mingguan"}</h2><p>${fmtDate(w.periodStart)} - ${fmtDate(w.periodEnd)}</p>${chunk.map(c=>c.html?`<div class="pdf-section"><h3>${esc(c.title)}</h3>${c.html}</div>`:section(c.title,c.text)).join("")}${footerHtml(p?.name,w.periodEnd)}</section>`)}return pages.join("")}
function dailyTablePage(w,s){const ds=s.dailySnapshots||[];return `<section class="paper"><h2>Daily Reports Source</h2><table class="daily-table"><thead><tr><th>Daily Report</th><th>Progress</th><th>Kendala</th><th>Follow-up</th></tr></thead><tbody>${ds.map(r=>`<tr><td>${esc(dailyDisplayName(r))}</td><td>${esc(r.progress||"-")}</td><td>${esc(r.kendala||"-")}</td><td>${esc(r.followUp||"-")}</td></tr>`).join("")}</tbody></table>${footerHtml(getProjectById(w.projectId)?.name,w.periodEnd)}</section>`}

function photoBlock(ph,date,area){if(!ph)return `<article class="photo-block" style="visibility:hidden"><div></div><div></div></article>`;return `<article class="photo-block"><div class="photo-frame"><img src="${ph.url}"><div class="watermark">${compactDateTime(ph.takenAt)} | ${fmtDate(date)}</div></div><div><h3>Foto No. ${String(ph.number||1).padStart(2,"0")}</h3><p><b>Tanggal:</b> ${fmtDate(date)}</p><p><b>Area:</b> ${esc(area||"-")}</p><p><b>Caption:</b><br>${esc(ph.caption||"-")}</p></div></article>`}
function attachmentReportPages(w){const a=w.progressAttachment,p=getProjectById(w.projectId);if(!a)return"";if(a.renderedPages?.length)return a.renderedPages.map((src,i)=>`<section class="paper pdf-attachment-page"><div class="kicker">Lampiran Progress</div><h2>Dokumen Progress${a.renderedPages.length>1?` - Halaman ${i+1}`:""}</h2><p class="muted">${esc(a.name)}</p><img src="${src}" alt="Lampiran progress halaman ${i+1}">${footerHtml(p?.name,w.periodEnd)}</section>`).join("");return `<section class="paper"><div class="kicker">Lampiran Progress</div><h2>Dokumen Progress</h2><p>${esc(a.name)}</p>${attachmentPreview(a)}${footerHtml(p?.name,w.periodEnd)}</section>`}

function dataUrlToBytes(dataUrl){const raw=atob(String(dataUrl||"").split(",")[1]||""),bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);return bytes}
function loadPdfJs(){if(window.pdfjsLib)return Promise.resolve(window.pdfjsLib);return new Promise((res,rej)=>{const existing=document.querySelector('script[data-pdfjs]');if(existing){existing.addEventListener("load",()=>res(window.pdfjsLib),{once:true});existing.addEventListener("error",rej,{once:true});return}const s=document.createElement("script");s.dataset.pdfjs="1";s.src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js";s.onload=()=>window.pdfjsLib?res(window.pdfjsLib):rej(new Error("PDF.js tidak tersedia"));s.onerror=()=>{s.remove();rej(new Error("Gagal memuat PDF.js."))};document.head.appendChild(s)})}
async function renderPdfDataUrlToImages(dataUrl){const pdfjs=await loadPdfJs();const doc=await pdfjs.getDocument({data:dataUrlToBytes(dataUrl),disableWorker:true}).promise;const pages=[];for(let i=1;i<=doc.numPages;i++){const page=await doc.getPage(i),base=page.getViewport({scale:1}),scale=Math.min(3,1800/base.width),viewport=page.getViewport({scale});const canvas=document.createElement("canvas");canvas.width=Math.ceil(viewport.width);canvas.height=Math.ceil(viewport.height);const ctx=canvas.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,canvas.width,canvas.height);await page.render({canvasContext:ctx,viewport}).promise;pages.push(canvas.toDataURL("image/jpeg",.9))}return pages}
async function ensureWeeklyPdfRendered(id){const w=getWeeklyById(id),a=w?.progressAttachment;if(!a||!String(a.type||"").includes("pdf")||a.renderedPages?.length||pdfRenderJobs.has(id))return;pdfRenderJobs.add(id);a.renderStatus="rendering";a.renderError="";save(false);try{a.renderedPages=await renderPdfDataUrlToImages(a.url);a.renderStatus="done";save(false)}catch(e){console.warn(e);a.renderStatus="failed";a.renderError=e.message||"PDF gagal dirender";save(false)}finally{pdfRenderJobs.delete(id);if(route==="weeklyPreview"&&previewWeeklyId===id)render()}}

function exportDailyPDF(id){const r=getDailyById(id),old=document.title;document.title=`Daily - ${cleanFile(getProjectById(r?.projectId)?.name)} - ${r?.date||today()}`;window.onafterprint=()=>{document.title=old;window.onafterprint=null};setTimeout(()=>{window.print();setTimeout(()=>{document.title=old},30000)},120)}

function bindForms(){const projectForm=$("#projectForm");if(projectForm)projectForm.onsubmit=e=>{e.preventDefault();saveProject(new FormData(projectForm))};const surveyForm=$("#surveyForm");if(surveyForm)surveyForm.onsubmit=e=>{e.preventDefault();saveSurvey(new FormData(surveyForm)).catch(err=>alert(`Survey gagal disimpan: ${err.message}`))};const convertForm=$("#convertSurveyForm");if(convertForm)convertForm.onsubmit=e=>{e.preventDefault();const fd=new FormData(convertForm);convertSurveyToDailyReport(fd.get("surveyId"),fd.get("projectId"))};const dailyForm=$("#dailyForm");if(dailyForm){dailyForm.oninput=()=>{lastSavedText="Ada perubahan belum disimpan";renderHeaderStatus();clearTimeout(autosaveTimer);autosaveTimer=setTimeout(()=>saveDailyReport(new FormData(dailyForm)).catch(console.warn),1400)};dailyForm.onsubmit=e=>{e.preventDefault();saveDailyReport(new FormData(dailyForm)).catch(err=>alert(`Daily gagal disimpan: ${err.message}`))}}const weeklyForm=$("#weeklyForm");if(weeklyForm)weeklyForm.onsubmit=e=>{e.preventDefault();const fd=new FormData(weeklyForm),projectId=fd.get("projectId"),periodStart=fd.get("periodStart"),periodEnd=fd.get("periodEnd"),dailies=getDailyReportsByProjectAndPeriod(projectId,periodStart,periodEnd),progressPdf=fd.get("progressPdf");if(!dailies.length){alert("Tidak ada Daily Report untuk proyek dan periode ini.");return}saveWeeklyReport(projectId,periodStart,periodEnd,generateWeeklySummaryFromDailyReports(dailies),progressPdf).catch(err=>alert(`Weekly gagal disimpan: ${err.message}`))};const restore=$("#restoreInput");if(restore)restore.onchange=e=>restoreJSON(e.target.files?.[0])}
function backupJSON(){const payload={appVersion:APP_VERSION,projects:db.projects,surveys:db.surveys,dailyReports:db.dailyReports,weeklyReports:db.weeklyReports,exportedAt:new Date().toISOString()};const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`ics-report-backup-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

function imageToData(file,max=1200,q=.78){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const s=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));const c=document.createElement("canvas");c.width=Math.max(1,Math.round(im.naturalWidth*s));c.height=Math.max(1,Math.round(im.naturalHeight*s));c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",q))};im.src=r.result};r.readAsDataURL(file)})}
